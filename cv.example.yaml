configurations:
  pdflatex:
    template: moderncv.pdflatex.tex.j2
    dockerfile: backend/pdflatex.dockerfile
    backend: pdflatex

  linkedin:
    template: linkedin.plaintext.txt.j2
    backend: plaintext

  sample-env:
    environment:
      color: green
      style: classic
      linkcolor: black
      urlcolor: blue
      hide-reference-contact-phone: true
      location: helios

  sample:
    basename: sample
    inherits:
    - pdflatex
    - sample-env

  sample-li:
    basename: sample
    inherits:
    - linkedin
    - sample-env

